services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: governbright
      POSTGRES_USER: governbright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a long random value}
    # Reachable from this machine only (for local tools and npm run dev), never from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - governbright_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governbright"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://governbright:${POSTGRES_PASSWORD}@db:5432/governbright
      APP_ORIGIN: http://localhost:3000
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY (openssl rand -base64 32)}
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://governbright:${POSTGRES_PASSWORD}@db:5432/governbright
      ALLOW_DEV_AUTH: "false"
      APP_ORIGIN: http://localhost:3000
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY (openssl rand -base64 32)}
      SESSION_TTL_HOURS: 12
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  governbright_db:
